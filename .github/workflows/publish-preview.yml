name: Publish digest preview

on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: Include this lane marker in the public preview. Leave blank after review.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Render the digest page
        env:
          LANE_ID: lane-07
          LANE_MARKER: ${{ inputs.lane_marker }}
        run: pnpm preview:save -- "${RUNNER_TEMP}/site/index.html"
      - name: Upload the one-file Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the preview
        id: deployment
        uses: actions/deploy-pages@v4
